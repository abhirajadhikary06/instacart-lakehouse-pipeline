global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus scrapes itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # MinIO metrics (built-in /minio/v2/metrics/cluster endpoint)
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # PostgreSQL DWH via postgres_exporter
  - job_name: postgres_dwh
    static_configs:
      - targets: ["postgres-exporter:9187"]
