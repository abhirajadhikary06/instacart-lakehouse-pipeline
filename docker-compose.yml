services:

  # ---------------------------------------------------------------------------
  # PHASE 1 — Object storage (MinIO)
  # Acts as the data lake: raw / bronze / silver / gold buckets
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3-compatible API  → dlt / Spark
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Browser console    → http://localhost:9001
    volumes:
      - minio-data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot init: creates raw / bronze / silver / gold buckets
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/raw &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold &&
      mc anonymous set download local/raw &&
      echo 'MinIO buckets ready';
      "
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # PHASE 1 — Spark cluster (standalone master + 2 workers, Delta Lake enabled)
  # ---------------------------------------------------------------------------
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-lakehouse-pipeline/spark:latest
    pull_policy: never
    container_name: lakehouse-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MODE: master
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"   # Spark Master UI → http://localhost:8081
      - "${SPARK_MASTER_PORT:-7077}:7077"       # Spark submit endpoint
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  spark-worker-1:
    image: instacart-lakehouse-pipeline/spark:latest
    pull_policy: never
    container_name: lakehouse-spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER1_UI_PORT:-8082}:8081"  # Worker 1 UI → http://localhost:8082
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - lakehouse
    restart: unless-stopped

  spark-worker-2:
    image: instacart-lakehouse-pipeline/spark:latest
    pull_policy: never
    container_name: lakehouse-spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER2_UI_PORT:-8083}:8081"  # Worker 2 UI → http://localhost:8083
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - lakehouse
    restart: unless-stopped

