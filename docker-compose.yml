name: instacart-lakehouse

# =============================================================================
# PHASE 1 — MinIO + Spark only.
# dlt ingestion runs locally (outside Docker) pointing at the MinIO container.
#
# Start:   docker compose up --build -d
# Stop:    docker compose down
#
# Subsequent phases will uncomment the relevant service blocks below.
# =============================================================================

