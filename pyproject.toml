[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "instacart-lakehouse-pipeline"
version = "0.1.0"
description = "Instacart Lakehouse — ingestion, Spark transformations, dbt models."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# Make ingestion/, spark/, etc. importable as top-level packages.
where = ["."]
include = ["ingestion*", "spark*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests", "spark/tests"]
python_files = ["test_*.py", "*_test.py"]
